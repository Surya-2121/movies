name: Sunset Ended Movies

# Daily cleanup: when every showtime for a movie has passed, remove it
# from Now Showing surfaces (home card, nowShowing sets, search arrays,
# notify list). Keeps the movie page + booking entries intact so any
# shared/bookmarked URLs still work.
#
# See scripts/sunset_ended_movies.py for details + the PROTECTED slug
# list (ustaad, peddi, maa-inti-bangaaram, vishwanath-and-sons,
# irumudi, toxic) that this agent never touches.

on:
  schedule:
    # Berlin CEST (summer, UTC+2): 06:00 local = 04:00 UTC
    # Runs daily after midnight so a movie whose last show was yesterday
    # is swept out before anyone opens the site.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sunset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sunset ended movies
        run: python scripts/sunset_ended_movies.py --apply

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html coming-soon.html js/nav.js scripts/send_notify.py 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Sunset ended movies $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git pull --rebase && git push)
