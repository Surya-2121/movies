name: Discover Paradise Shows

# Auto-poll Zineflix for new "The Paradise" (movieId=77) shows and
# patch booking.html + data/paradise_shows.json so new dates/cinemas
# appear on the public site without manual editing.
#
# Only touches the `paradise:` sub-entry inside `const movies = {...}`
# — never the whole movies object.

on:
  schedule:
    # Berlin CEST (summer, UTC+2): 08:00, 13:00, 15:00, 18:00, 23:30 local
    # = 06:00, 11:00, 13:00, 16:00, 21:30 UTC
    # (Times will shift by 1h during winter CET; acceptable for show pickup.)
    - cron: '0 6,11,13,16 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover Paradise shows from Zineflix
        run: python scripts/discover_paradise_shows.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add booking.html data/paradise_shows.json
          git diff --staged --quiet || (git commit -m "Auto-discover Paradise shows $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git pull --rebase && git push)
