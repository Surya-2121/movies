name: Discover Peddi Shows (daily)

# Daily discovery of new Peddi shows from Zineflix + per-cinema platforms.
# Updates booking.html and data/peddi_shows.json so new dates/cinemas
# show up on the public site automatically.
#
# This workflow does NOT refresh data/peddi_seats.json (the revenue
# dashboard) — that's handled separately by `update-peddi-seats.yml`
# and only runs when triggered manually.

on:
  schedule:
    # 15:00 UTC = 17:00 Berlin CEST (summer), 16:00 CET (winter)
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover Peddi shows (Zineflix + per-cinema platforms)
        run: python scripts/discover_peddi_shows.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add booking.html data/peddi_shows.json
          git diff --staged --quiet || (git commit -m "Auto-discover Peddi shows $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git pull --rebase && git push)
