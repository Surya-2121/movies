name: Discover Cinemaxx Shows

# Scans every Cinemaxx.de city for each tracked movie's showtimes and
# merges new shows into <slug>_manual.json + booking.html.
#
# Cinemaxx sits behind Cloudflare Turnstile, so this workflow drives
# patchright's Chromium in headed mode via xvfb-run (invisible on CI).
# Requests carry an identifying `X-Bot-Contact` header pointing at
# germany-telugu-movies.com so any cinema can contact / opt out.
#
# Movies with `cinemaxxSlug` in data/zineflix_movies.json are picked up
# automatically — no code changes needed to onboard a new film.

on:
  schedule:
    # Berlin CEST (summer, UTC+2): 09:15 + 21:15 local = 07:15 + 19:15 UTC.
    # Twice a day is enough — Cinemaxx typically publishes new dates on
    # Monday for the coming Thursday+ (per Traumpalast/Cinecitta pattern).
    - cron: '15 7,19 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optional: single movie slug to scan (empty = all).'
        required: false
        type: string

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install patchright + Chromium
        run: |
          python -m pip install --quiet patchright
          python -m patchright install chromium
          # System deps for headed Chromium + a virtual display
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb \
            libnss3 libatk-bridge2.0-0 libcups2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64

      - name: Run Cinemaxx agent under xvfb
        env:
          BROWSER_FETCH_CHANNEL: chromium   # use patchright's bundled build in CI
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            xvfb-run --auto-servernum python scripts/discover_cinemaxx_shows.py "${{ github.event.inputs.slug }}"
          else
            xvfb-run --auto-servernum python scripts/discover_cinemaxx_shows.py
          fi

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add booking.html data/*_manual.json data/*_cinemaxx.json data/cinemaxx_alerts.md 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Cinemaxx scan $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git pull --rebase && git push)
