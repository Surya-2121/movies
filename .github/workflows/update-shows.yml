name: Update 3 Realms Shows

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape 3 Realms shows
        run: python scripts/update_shows.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add booking.html
          git diff --staged --quiet || (git commit -m "Auto-update shows from 3 Realms $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git pull --rebase && git push)
