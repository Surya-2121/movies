name: Update Peddi Shows & Seats

on:
  # Manual-only: run on demand from the GitHub Actions tab.
  # (Daily cron disabled by user request 2026-05-26.)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover Peddi shows (Zineflix + per-cinema platforms)
        run: python scripts/discover_peddi_shows.py

      - name: Scrape per-show seat counts
        run: python scripts/fetch_peddi_seats.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add booking.html data/peddi_shows.json data/peddi_seats.json
          git diff --staged --quiet || (git commit -m "Auto-update Peddi shows & seats $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git pull --rebase && git push)
