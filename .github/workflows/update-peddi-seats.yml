name: Update Peddi Seats

on:
  schedule:
    # 15:00 UTC = 17:00 CEST (Berlin summer time, when Peddi is showing)
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape Peddi seat counts
        run: python scripts/fetch_peddi_seats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/peddi_seats.json
          git diff --staged --quiet || (git commit -m "Auto-update Peddi seat counts $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git pull --rebase && git push)
