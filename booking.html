    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Header */
    .bk-header { background: #0f0f1a; padding: 16px 20px; position: sticky; top: 0; z-index: 100; }
    .bk-header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
    .bk-back { background: none; border: none; color: #f0ad4e; font-size: 0.85rem; cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: background 0.2s; text-decoration: none; line-height: 1; white-space: nowrap; border: 1px solid #2a2a4a; }
    .bk-back:hover { background: #1a1a2e; border-color: #f0ad4e; }
    .bk-movie-info { flex: 1; }
    .bk-movie-title { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .bk-movie-meta { font-size: 0.8rem; color: #999; margin-top: 2px; }
    .bk-movie-meta span { margin-right: 8px; }
    .bk-lang-badge { background: rgba(240,173,78,0.15); color: #f0ad4e; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }

    /* Date Tabs */
    .bk-datebar { position: relative; background: #0f0f1a; border-bottom: 1px solid #2a2a4a; }
    .bk-dates { padding: 0 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .bk-dates::-webkit-scrollbar { display: none; }
    .bk-dates-inner { max-width: 960px; margin: 0 auto; display: flex; gap: 4px; padding-right: 52px; }
    .bk-date-tab { padding: 12px 20px; border: none; background: none; color: #999; font-size: 0.8rem; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; text-align: center; font-family: inherit; }
    .bk-date-tab:hover { color: #e0e0e0; }
    .bk-date-tab.active { color: #f0ad4e; border-bottom-color: #f0ad4e; font-weight: 600; }
    .bk-date-day { display: block; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 2px; }
    .bk-date-num { display: block; font-size: 1.1rem; font-weight: 700; }
    .bk-date-month { display: block; font-size: 0.65rem; text-transform: uppercase; }

    /* Search overlay in date bar */
    .bk-search-wrap { position: absolute; right: 0; top: 0; bottom: 0; padding-right: 12px; padding-left: 8px; display: flex; align-items: center; z-index: 10; background: #0f0f1a; }
    .bk-search-icon { background: none; border: none; color: #f0ad4e; font-size: 1.1rem; cursor: pointer; padding: 8px 10px; line-height: 1; }
    .bk-search-icon:hover { color: #fff; }
    .bk-search { width: 0; padding: 0; background: #0f0f1a; border: none; border-bottom: 2px solid #f0ad4e; color: #e0e0e0; font-size: 0.8rem; outline: none; font-family: inherit; transition: width 0.3s, padding 0.3s; border-radius: 0; overflow: hidden; }
    .bk-search.open { width: 180px; padding: 6px 10px; }
    .bk-search::placeholder { color: #666; }

    /* City accordion */
    .bk-cinemas { max-width: 960px; margin: 0 auto; padding: 0 20px 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
    .bk-city { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; overflow: hidden; transition: border-color 0.2s; }
    .bk-city.open { border-color: #f0ad4e; }
    .bk-city-header { width: 100%; background: none; border: none; cursor: pointer; padding: 18px 22px; display: flex; align-items: center; gap: 12px; font-family: inherit; text-align: left; }
    .bk-city-header:hover { background: rgba(240,173,78,0.06); }
    .bk-city-name { font-size: 1.05rem; font-weight: 700; color: #fff; flex: 1; }
    .bk-city-meta { font-size: 0.72rem; color: #999; white-space: nowrap; }
    .bk-city-arrow { color: #f0ad4e; font-size: 0.8rem; transition: transform 0.2s; }
    .bk-city.open .bk-city-arrow { transform: rotate(180deg); }
    .bk-city-body { display: none; padding: 0 16px 10px; }
    .bk-city.open .bk-city-body { display: block; }

    /* Cinema card (inside a city) */
    .bk-city-body .bk-cinema { margin-top: 10px; }
    .bk-cinema { background: #16162a; border: 1px solid #2a2a4a; border-radius: 10px; padding: 16px 18px; margin-top: 16px; transition: border-color 0.2s; display: flex; align-items: flex-start; gap: 24px; }
    .bk-cinema:hover { border-color: #f0ad4e; }
    .bk-cinema-left { flex-shrink: 0; width: 180px; }
    .bk-cinema-name { font-size: 0.95rem; font-weight: 600; color: #fff; line-height: 1.3; }
    .bk-cinema-sub { font-size: 0.65rem; color: #999; margin-top: 4px; }
    .bk-cinema-right { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .bk-showtime { border: 1px solid #2a2a4a; color: #f0ad4e; background: transparent; padding: 10px 22px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-block; font-family: inherit; }
    .bk-showtime:hover { background: #f0ad4e; color: #000; border-color: #f0ad4e; }
    .bk-showtime-label { display: block; font-size: 0.6rem; color: #999; font-weight: 400; margin-top: 2px; text-align: center; }
    .bk-showtime:hover .bk-showtime-label { color: #333; }

    /* Empty State */
    .bk-empty { text-align: center; padding: 60px 20px; color: #999; }
    .bk-empty-icon { font-size: 3rem; margin-bottom: 16px; }
    .bk-empty h3 { color: #e0e0e0; font-size: 1.1rem; margin-bottom: 8px; }

    /* Powered by */
    .bk-powered { text-align: center; padding: 20px; color: #666; font-size: 0.7rem; }
    .bk-powered a { color: #f0ad4e; text-decoration: none; }

    /* Mobile */
    @media (max-width: 760px) {
      .bk-cinemas { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .bk-header-inner { gap: 10px; }
      .bk-movie-title { font-size: 1.05rem; }
      .bk-date-tab { padding: 10px 14px; }
      .bk-showtime { padding: 8px 16px; font-size: 0.8rem; }
      .bk-cinema { padding: 16px; flex-direction: column; gap: 12px; }
      .bk-cinema-left { width: auto; }
      .bk-cinema-name { font-size: 0.9rem; }
      .bk-search.open { width: 130px; }
    }

    .light-theme { background: #f5f5f5; color: #222; }
    .light-theme .bk-header { background: #fff; }
    .light-theme .bk-back { color: #d4880f; border-color: #ddd; }

    // Get movie from URL
    const params = new URLSearchParams(window.location.search);
    const movieSlug = params.get('movie');
    const movie = movies[movieSlug];

    if (!movie) {
      document.getElementById('movieTitle').textContent = 'Movie not found';
      document.getElementById('cinemaList').innerHTML = '<div class="bk-empty"><div class="bk-empty-icon">&#127916;</div><h3>No movie selected</h3><p>Please go back and select a movie.</p></div>';
    } else {
      // Set page title & header
      document.title = movie.title + ' - Book Tickets | Germany Telugu Movies';
      document.getElementById('movieTitle').textContent = movie.title;
      document.getElementById('movieMeta').innerHTML = '<span>' + movie.genre + '</span> <span class="bk-lang-badge">' + movie.language + '</span>';
      document.getElementById('backLink').href = movie.page;

      // Filter out past dates (compare date strings against today)
      const today = new Date().toISOString().split('T')[0];
      const shows = movie.shows.filter(s => s.date >= today);
      let selectedDate = 'all';

      function buildDateTabs() {
        const dates = [...new Set(shows.map(s => s.date))].sort();
        const container = document.getElementById('dateTabs');

        let html = `<button class="bk-date-tab active" data-date="all" onclick="selectDate(this,'all')">
          <span class="bk-date-num">All Dates</span>
        </button>`;

        dates.forEach(d => {
          const dt = new Date(d + 'T00:00:00');
          const day = dt.toLocaleDateString('en-GB', { weekday: 'short' });
          const num = dt.getDate();
          const month = dt.toLocaleDateString('en-GB', { month: 'short' });
          html += `<button class="bk-date-tab" data-date="${d}" onclick="selectDate(this,'${d}')">
            <span class="bk-date-day">${day}</span>
            <span class="bk-date-num">${num}</span>
            <span class="bk-date-month">${month}</span>
          </button>`;
        });

        container.innerHTML = html;
      }

      window.selectDate = function(el, date) {
        selectedDate = date;
        document.querySelectorAll('.bk-date-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderCinemas();
      };

      function renderCinemas() {
        const search = document.getElementById('cinemaSearch').value.toLowerCase();
        let filtered = shows;

        if (selectedDate !== 'all') filtered = filtered.filter(s => s.date === selectedDate);
        if (search) filtered = filtered.filter(s => s.cinema.toLowerCase().includes(search) || s.city.toLowerCase().includes(search));

        // Group by city -> cinema -> shows
        const cities = {};
        filtered.forEach(s => {
          if (!cities[s.city]) cities[s.city] = {};
          if (!cities[s.city][s.cinema]) cities[s.city][s.cinema] = [];
          cities[s.city][s.cinema].push(s);
        });

        const container = document.getElementById('cinemaList');
        const cityNames = Object.keys(cities).sort();

        if (cityNames.length === 0) {
          container.innerHTML = `<div class="bk-empty">
            <div class="bk-empty-icon">&#127916;</div>
            <h3>No shows found</h3>
            <p>Try selecting a different date or clearing filters.</p>
          </div>`;
          return;
        }

        // Auto-expand cities when the user is actively searching
        const expand = !!search;

        let html = '';
        cityNames.forEach(city => {
          const cinemas = cities[city];
          const cinemaNames = Object.keys(cinemas).sort();
          const showCount = cinemaNames.reduce((a, c) => a + cinemas[c].length, 0);
          const meta = `${cinemaNames.length} cinema${cinemaNames.length > 1 ? 's' : ''} &bull; ${showCount} show${showCount > 1 ? 's' : ''}`;

          html += `<div class="bk-city${expand ? ' open' : ''}">
            <button class="bk-city-header" onclick="toggleCity(this)">
              <span class="bk-city-name">${city}</span>
              <span class="bk-city-meta">${meta}</span>
              <span class="bk-city-arrow">&#9662;</span>
            </button>
            <div class="bk-city-body">`;

          cinemaNames.forEach(cn => {
            const cs = cinemas[cn];
            html += `<div class="bk-cinema">
              <div class="bk-cinema-left">
                <div class="bk-cinema-name">${cn}</div>
                <div class="bk-cinema-sub">${movie.language} &bull; ${cs[0].subtitle || ''}</div>
              </div>
              <div class="bk-cinema-right">`;
            cs.forEach(s => {
              const dt = new Date(s.date + 'T00:00:00');
              const dateLabel = dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
              html += `<a href="${s.bookingUrl}" target="_blank" rel="noopener" class="bk-showtime">
                ${s.time}
                <span class="bk-showtime-label">${dateLabel}</span>
              </a>`;
            });
            html += `</div></div>`;
          });

          html += `</div></div>`;
        });

        container.innerHTML = html;
      }

      window.toggleCity = function(btn) {
        btn.parentElement.classList.toggle('open');
      };

      buildDateTabs();
      renderCinemas();
      document.getElementById('cinemaSearch').addEventListener('input', renderCinemas);
    }

    window.toggleBkSearch = function() {
      const input = document.getElementById('cinemaSearch');
      input.classList.toggle('open');
      if (input.classList.contains('open')) {
        input.focus();
      } else {
        input.value = '';
        if (movie) renderCinemas();
      }
    };
  </script>
