<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Tickets | Germany Telugu Movies</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }

    /* Header */
    .bk-header { background: #0f0f1a; border-bottom: 1px solid #2a2a4a; padding: 16px 20px; position: sticky; top: 0; z-index: 100; }
    .bk-header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
    .bk-back { background: none; border: none; color: #e0e0e0; font-size: 1.5rem; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: background 0.2s; text-decoration: none; line-height: 1; }
    .bk-back:hover { background: #1a1a2e; color: #f0ad4e; }
    .bk-movie-info { flex: 1; }
    .bk-movie-title { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .bk-movie-meta { font-size: 0.8rem; color: #999; margin-top: 2px; }
    .bk-movie-meta span { margin-right: 8px; }
    .bk-lang-badge { background: rgba(240,173,78,0.15); color: #f0ad4e; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }

    /* Date Tabs */
    .bk-dates { background: #0f0f1a; border-bottom: 1px solid #2a2a4a; padding: 0 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; position: relative; }
    .bk-dates::-webkit-scrollbar { display: none; }
    .bk-dates-inner { max-width: 960px; margin: 0 auto; display: flex; gap: 4px; padding-right: 40px; }
    .bk-date-tab { padding: 12px 20px; border: none; background: none; color: #999; font-size: 0.8rem; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; text-align: center; font-family: inherit; }
    .bk-date-tab:hover { color: #e0e0e0; }
    .bk-date-tab.active { color: #f0ad4e; border-bottom-color: #f0ad4e; font-weight: 600; }
    .bk-date-day { display: block; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 2px; }
    .bk-date-num { display: block; font-size: 1.1rem; font-weight: 700; }
    .bk-date-month { display: block; font-size: 0.65rem; text-transform: uppercase; }

    /* Search overlay in date bar */
    .bk-search-wrap { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; z-index: 10; }
    .bk-search-icon { background: none; border: none; color: #f0ad4e; font-size: 1.1rem; cursor: pointer; padding: 8px 10px; line-height: 1; }
    .bk-search-icon:hover { color: #fff; }
    .bk-search { width: 0; padding: 0; background: #0f0f1a; border: none; border-bottom: 2px solid #f0ad4e; color: #e0e0e0; font-size: 0.8rem; outline: none; font-family: inherit; transition: width 0.3s, padding 0.3s; border-radius: 0; overflow: hidden; }
    .bk-search.open { width: 180px; padding: 6px 10px; }
    .bk-search::placeholder { color: #666; }

    /* Cinema List */
    .bk-cinemas { max-width: 960px; margin: 0 auto; padding: 0 20px 40px; }
    .bk-cinema { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 20px 22px; margin-top: 16px; transition: border-color 0.2s; display: flex; align-items: flex-start; gap: 24px; }
    .bk-cinema:hover { border-color: #f0ad4e; }
    .bk-cinema-left { flex-shrink: 0; width: 180px; }
    .bk-cinema-name { font-size: 0.95rem; font-weight: 600; color: #fff; line-height: 1.3; }
    .bk-cinema-sub { font-size: 0.65rem; color: #999; margin-top: 4px; }
    .bk-cinema-right { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .bk-showtime { border: 1px solid #2a2a4a; color: #f0ad4e; background: transparent; padding: 10px 22px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-block; font-family: inherit; }
    .bk-showtime:hover { background: #f0ad4e; color: #000; border-color: #f0ad4e; }
    .bk-showtime-label { display: block; font-size: 0.6rem; color: #999; font-weight: 400; margin-top: 2px; text-align: center; }
    .bk-showtime:hover .bk-showtime-label { color: #333; }

    /* Empty State */
    .bk-empty { text-align: center; padding: 60px 20px; color: #999; }
    .bk-empty-icon { font-size: 3rem; margin-bottom: 16px; }
    .bk-empty h3 { color: #e0e0e0; font-size: 1.1rem; margin-bottom: 8px; }

    /* Powered by */
    .bk-powered { text-align: center; padding: 20px; color: #666; font-size: 0.7rem; }
    .bk-powered a { color: #f0ad4e; text-decoration: none; }

    /* Mobile */
    @media (max-width: 600px) {
      .bk-header-inner { gap: 10px; }
      .bk-movie-title { font-size: 1.05rem; }
      .bk-date-tab { padding: 10px 14px; }
      .bk-showtime { padding: 8px 16px; font-size: 0.8rem; }
      .bk-cinema { padding: 16px; flex-direction: column; gap: 12px; }
      .bk-cinema-left { width: auto; }
      .bk-cinema-name { font-size: 0.9rem; }
      .bk-search.open { width: 130px; }
    }

    /* Light theme */
    .light-theme { background: #f5f5f5; color: #222; }
    .light-theme .bk-header { background: #fff; border-bottom-color: #ddd; }
    .light-theme .bk-back { color: #333; }
    .light-theme .bk-back:hover { background: #f0f0f0; color: #d4880f; }
    .light-theme .bk-movie-title { color: #222; }
    .light-theme .bk-movie-meta { color: #888; }
    .light-theme .bk-lang-badge { background: rgba(212,136,15,0.1); color: #d4880f; }
    .light-theme .bk-dates { background: #fff; border-bottom-color: #ddd; }
    .light-theme .bk-date-tab { color: #888; }
    .light-theme .bk-date-tab:hover { color: #333; }
    .light-theme .bk-date-tab.active { color: #d4880f; border-bottom-color: #d4880f; }
    .light-theme .bk-search-icon { color: #d4880f; }
    .light-theme .bk-search-icon:hover { color: #222; }
    .light-theme .bk-search { background: #f5f5f5; border-bottom-color: #d4880f; color: #222; }
    .light-theme .bk-search::placeholder { color: #999; }
    .light-theme .bk-cinema { background: #fff; border-color: #ddd; }
    .light-theme .bk-cinema:hover { border-color: #d4880f; }
    .light-theme .bk-cinema-name { color: #222; }
    .light-theme .bk-cinema-sub { color: #888; }
    .light-theme .bk-showtime { border-color: #ddd; color: #d4880f; }
    .light-theme .bk-showtime:hover { background: #d4880f; color: #fff; border-color: #d4880f; }
    .light-theme .bk-showtime-label { color: #888; }
    .light-theme .bk-showtime:hover .bk-showtime-label { color: rgba(255,255,255,0.8); }
    .light-theme .bk-empty { color: #888; }
    .light-theme .bk-empty h3 { color: #333; }
    .light-theme .bk-powered { color: #999; }
    .light-theme .bk-powered a { color: #d4880f; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="bk-header">
    <div class="bk-header-inner">
      <a id="backLink" href="index.html" class="bk-back" title="Back">&#8592;</a>
      <div class="bk-movie-info">
        <div class="bk-movie-title" id="movieTitle"></div>
        <div class="bk-movie-meta" id="movieMeta"></div>
      </div>
    </div>
  </header>

  <!-- Date Tabs + Search -->
  <div class="bk-dates">
    <div class="bk-dates-inner" id="dateTabs"></div>
    <div class="bk-search-wrap">
      <input type="text" class="bk-search" id="cinemaSearch" placeholder="Search cinemas...">
      <button class="bk-search-icon" onclick="toggleSearch()" title="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    </div>
  </div>

  <!-- Cinema Listings -->
  <div class="bk-cinemas" id="cinemaList"></div>

  <div class="bk-powered">
    Powered by <a href="index.html">Germany Telugu Movies</a> &bull; Data from <a href="https://3realmsentertainment.com" target="_blank" rel="noopener">3 Realms Entertainment</a>
  </div>

  <script>
    // Sync theme from main site
    (function() {
      const theme = localStorage.getItem('theme');
      if (theme === 'light') document.body.classList.add('light-theme');
    })();

    // ===== MOVIE DATA =====
    // To add a new movie: add an entry to this object with the movie slug as key.
    // Link to this page as: booking.html?movie=slug
    const movies = {
      dacoit: {
        title: "Dacoit",
        genre: "Action / Drama / Romance",
        language: "Telugu",
        page: "dacoit-movie.html",
        shows: [
            {
                      "city": "Dusseldorf",
                      "cinema": "UFA Palast",
                      "date": "2026-04-11",
                      "time": "16:50",
                      "subtitle": "English Subtitles",
                      "bookingUrl": "https://www.ufa-duesseldorf.de/de/programm/1869496"
            },
            {
                      "city": "Dusseldorf",
                      "cinema": "UFA Palast",
                      "date": "2026-04-12",
                      "time": "16:50",
                      "subtitle": "English Subtitles",
                      "bookingUrl": "https://www.ufa-duesseldorf.de/de/programm/1869496"
            },
            {
                      "city": "Stuttgart",
                      "cinema": "Delphi Kino",
                      "date": "2026-04-12",
                      "time": "12:30",
                      "subtitle": "English Subtitles",
                      "bookingUrl": "https://billetto.eu/en/e/dacoit-telugu-with-english-subtitles-in-stuttgart-Tickets-1897924/select"
            },
            {
                      "city": "Magdeburg",
                      "cinema": "Studio Kino",
                      "date": "2026-04-10",
                      "time": "19:45",
                      "subtitle": "English Subtitles",
                      "bookingUrl": "https://tinyurl.com/SDExhibitors"
            }
]
      }
    };

    // Get movie from URL
    const params = new URLSearchParams(window.location.search);
    const movieSlug = params.get('movie');
    const movie = movies[movieSlug];

    if (!movie) {
      document.getElementById('movieTitle').textContent = 'Movie not found';
      document.getElementById('cinemaList').innerHTML = '<div class="bk-empty"><div class="bk-empty-icon">&#127916;</div><h3>No movie selected</h3><p>Please go back and select a movie.</p></div>';
    } else {
      // Set page title & header
      document.title = movie.title + ' - Book Tickets | Germany Telugu Movies';
      document.getElementById('movieTitle').textContent = movie.title;
      document.getElementById('movieMeta').innerHTML = '<span>' + movie.genre + '</span> <span class="bk-lang-badge">' + movie.language + '</span>';
      document.getElementById('backLink').href = movie.page;

      const shows = movie.shows;
      let selectedDate = 'all';

      function buildDateTabs() {
        const dates = [...new Set(shows.map(s => s.date))].sort();
        const container = document.getElementById('dateTabs');

        let html = `<button class="bk-date-tab active" data-date="all" onclick="selectDate(this,'all')">
          <span class="bk-date-num">All Dates</span>
        </button>`;

        dates.forEach(d => {
          const dt = new Date(d + 'T00:00:00');
          const day = dt.toLocaleDateString('en-GB', { weekday: 'short' });
          const num = dt.getDate();
          const month = dt.toLocaleDateString('en-GB', { month: 'short' });
          html += `<button class="bk-date-tab" data-date="${d}" onclick="selectDate(this,'${d}')">
            <span class="bk-date-day">${day}</span>
            <span class="bk-date-num">${num}</span>
            <span class="bk-date-month">${month}</span>
          </button>`;
        });

        container.innerHTML = html;
      }

      window.selectDate = function(el, date) {
        selectedDate = date;
        document.querySelectorAll('.bk-date-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderCinemas();
      };

      function renderCinemas() {
        const search = document.getElementById('cinemaSearch').value.toLowerCase();
        let filtered = shows;

        if (selectedDate !== 'all') filtered = filtered.filter(s => s.date === selectedDate);
        if (search) filtered = filtered.filter(s => s.cinema.toLowerCase().includes(search) || s.city.toLowerCase().includes(search));

        const grouped = {};
        filtered.forEach(s => {
          const key = s.cinema + '|' + s.city;
          if (!grouped[key]) grouped[key] = { cinema: s.cinema, city: s.city, shows: [] };
          grouped[key].shows.push(s);
        });

        const container = document.getElementById('cinemaList');

        if (Object.keys(grouped).length === 0) {
          container.innerHTML = `<div class="bk-empty">
            <div class="bk-empty-icon">&#127916;</div>
            <h3>No shows found</h3>
            <p>Try selecting a different date or clearing filters.</p>
          </div>`;
          return;
        }

        let html = '';
        Object.values(grouped).forEach(g => {
          html += `<div class="bk-cinema">
            <div class="bk-cinema-left">
              <div class="bk-cinema-name">${g.cinema}, ${g.city}</div>
              <div class="bk-cinema-sub">${movie.language} &bull; ${g.shows[0].subtitle || ''}</div>
            </div>
            <div class="bk-cinema-right">`;

          g.shows.forEach(s => {
            const dt = new Date(s.date + 'T00:00:00');
            const dateLabel = dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
            html += `<a href="${s.bookingUrl}" target="_blank" rel="noopener" class="bk-showtime">
              ${s.time}
              <span class="bk-showtime-label">${dateLabel}</span>
            </a>`;
          });

          html += `</div></div>`;
        });

        container.innerHTML = html;
      }

      buildDateTabs();
      renderCinemas();
      document.getElementById('cinemaSearch').addEventListener('input', renderCinemas);
    }

    window.toggleSearch = function() {
      const input = document.getElementById('cinemaSearch');
      input.classList.toggle('open');
      if (input.classList.contains('open')) {
        input.focus();
      } else {
        input.value = '';
        if (movie) renderCinemas();
      }
    };
  </script>

</body>
</html>
